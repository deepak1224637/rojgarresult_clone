{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>{{ card.title }}</h1>
    <p><strong>Posted on:</strong> {{ card.posted_on|date:"d M Y" }}</p>
    <hr>
    <p>{{ card.description|linebreaks }}</p>

    {% if card.download_link %}
        <a href="{{ card.download_link }}" class="btn btn-primary" target="_blank">
            Download Admit Card
        </a>
    {% endif %}
</div>
{% endblock %}
